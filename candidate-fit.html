<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta name="robots" content="noindex,nofollow"><title>MATOK BASIC | שאלון התאמה לעבודה</title><style>
:root{font-family:Arial,Heebo,sans-serif;color:#1a1a2e;background:#f5f0e8}*{box-sizing:border-box}body{margin:0;padding:18px}.page{max-width:760px;margin:auto}.brand{text-align:center;margin:16px 0 22px}.brand b{display:block;letter-spacing:3px;font-size:29px}.brand small{letter-spacing:6px}.bars{display:flex;gap:3px;justify-content:center;margin-top:11px}.bars i{height:5px;width:28px;border-radius:4px;background:#e8826a}.bars i:nth-child(2){background:#6bbfb5}.bars i:nth-child(3){background:#a7cb8e}.bars i:nth-child(4){background:#7eb4dc}.bars i:nth-child(5){background:#f2c77a}.card{background:#fff;border:1px solid #ded9d1;border-radius:18px;padding:22px;box-shadow:0 9px 25px #1a1a2e10}h1{margin:0 0 8px;font-size:25px}p{line-height:1.65;color:#5c5963}label{display:block;font-size:13px;font-weight:bold;margin:13px 0 0}input,textarea,select{width:100%;font:inherit;margin-top:6px;padding:11px;border:1px solid #c5c8d0;border-radius:10px;background:#fff;direction:rtl}textarea{min-height:88px;resize:vertical}.cols{display:grid;grid-template-columns:1fr 1fr;gap:0 13px}.consent{display:flex;gap:8px;align-items:flex-start;font-weight:normal;line-height:1.6}.consent input{width:20px;flex:0 0 20px;margin-top:4px}.button{display:block;width:100%;border:0;border-radius:12px;background:#1a1a2e;color:#fff;padding:15px;font-weight:bold;font-size:17px;margin-top:18px;cursor:pointer}.button:disabled{opacity:.5}#status{padding:10px;margin-top:11px;border-radius:10px;display:none}#status.show{display:block;background:#eef9f6;color:#245c50}#status.error{background:#fff0ed;color:#8c372f}small{color:#686676}@media(max-width:570px){.cols{grid-template-columns:1fr}.card{padding:16px}}</style></head><body><div class="page"><div class="brand"><b>MATOK</b><small>BASIC</small><div class="bars"><i></i><i></i><i></i><i></i><i></i></div></div><main class="card"><h1>שאלון התאמה לעבודה</h1><p>השאלון עוזר לנו להכיר את הזמינות, הניסיון וסגנון העבודה שלך לפני ראיון או קליטה.</p><div id="initial">בודקים את הקישור…</div><form id="fitForm" style="display:none" autocomplete="on"><div class="cols"><label>שם מלא *<input name="full_name" required minlength="2" maxlength="150" autocomplete="name"></label><label>טלפון *<input name="phone" required minlength="9" maxlength="17" inputmode="tel" autocomplete="tel"></label><label>משמרות מועדפות<select name="preferred_shifts"><option value="">בחרו</option><option>בוקר</option><option>ערב</option><option>בוקר וערב</option><option>גמיש/ה</option></select></label><label>זמינות לימי שישי<select name="friday_availability"><option value="">בחרו</option><option>כל שישי</option><option>שישי לסירוגין</option><option>בתיאום</option><option>לא זמין/ה</option></select></label><label>מועד תחילת עבודה אפשרי<input name="start_date" type="date"></label><label>הגעה עצמאית לעבודה<select name="independent_arrival"><option value="">בחרו</option><option>כן</option><option>לא</option><option>תלוי במשמרת</option></select></label></div><label>ניסיון במכירות / שירות לקוחות<textarea name="sales_experience" maxlength="1200"></textarea></label><label>ניסיון בקופה<textarea name="cashier_experience" maxlength="500"></textarea></label><label>ידע ברשתות חברתיות / צילום / יצירת תוכן<textarea name="social_media" maxlength="700"></textarea></label><label>לקוח לא מרוצה עומד מולך. איך היית ניגש/ת למצב?<textarea name="customer_service" maxlength="1200"></textarea></label><label>מה חשוב לך במקום עבודה ומה רמת המחויבות שאת/ה מחפש/ת?<textarea name="commitment" maxlength="700"></textarea></label><label>משהו נוסף שחשוב שנדע<textarea name="notes" maxlength="1200"></textarea></label><label class="consent"><input name="consent" type="checkbox" required><span>אני מאשר/ת להעביר את תשובות השאלון להנהלת MATOK BASIC לצורך בחינת התאמה לעבודה.</span></label><input type="text" name="website" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-9999px;width:1px;height:1px"><button id="submitBtn" class="button" type="submit">שליחת השאלון</button></form><div id="status" role="status" aria-live="polite"></div></main></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4" referrerpolicy="no-referrer"></script><script>window.MATOK_PUBLIC_CONFIG={url:%%SUPABASE_URL%%,key:%%SUPABASE_KEY%%};</script><script src="/candidate-fit-client.js" referrerpolicy="no-referrer"></script></body></html>
