<!doctype html>
<html lang="he" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>MATOK BASIC · שאלון קליטת עובד</title>
<style>
:root{--navy:#172641;--teal:#317a70;--line:#d7e2e8;--ink:#203149;--bg:#f5f8fa}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,"Noto Sans Hebrew",sans-serif;line-height:1.55}
header{background:var(--navy);color:#fff;padding:21px 19px;box-shadow:0 5px 16px #17264118}
.brand{max-width:760px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand b{font-size:25px;letter-spacing:.08em}.brand small{font-size:12px;color:#dce6eb}
.stripes{display:flex;gap:3px}.stripes i{display:block;width:22px;height:5px;border-radius:4px}.stripes i:nth-child(1){background:#e8826a}.stripes i:nth-child(2){background:#6bbfb5}.stripes i:nth-child(3){background:#a7cb8e}.stripes i:nth-child(4){background:#7eb4dc}.stripes i:nth-child(5){background:#f2c77a}
main{max-width:760px;margin:22px auto;padding:0 12px 40px}.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:26px;box-shadow:0 9px 28px #1726410a}
h1{font-size:26px;margin:0 0 4px}h2{font-size:17px;margin:25px 0 9px;color:var(--navy)}p{margin:2px 0 17px;color:#667686}.fields{display:grid;grid-template-columns:1fr 1fr;gap:13px}label{display:grid;gap:6px;font-size:13px;font-weight:700}
input,select,textarea{width:100%;min-height:44px;border:1px solid #cbd8e0;border-radius:11px;padding:11px;background:white;color:#203149;font:inherit}
input:focus,select:focus,textarea:focus{outline:2px solid #61a79b;outline-offset:1px}textarea{resize:vertical}
.wide{grid-column:1/-1}.check{display:flex;align-items:flex-start;gap:10px;background:#f1f8f6;border-radius:11px;padding:13px;margin:21px 0}.check input{width:20px;min-height:auto;margin-top:3px}
button{border:0;border-radius:13px;background:var(--teal);color:white;min-height:52px;width:100%;font:inherit;font-weight:800;cursor:pointer}button:disabled{opacity:.6;cursor:wait}
.status{display:none;padding:13px;border:1px solid #aed4cb;background:#f0faf7;border-radius:11px;margin-bottom:14px}.status.error{background:#fff2ef;border-color:#e7b5a7;color:#8e4032}
.note{background:#f6f8fa;border-right:4px solid #77b9ae;border-radius:8px;padding:11px;margin:15px 0;font-size:12px}
@media(max-width:560px){main{margin:10px auto}.card{padding:19px 14px}.fields{grid-template-columns:1fr}.wide{grid-column:auto}}
</style></head>
<body><header><div class="brand"><div><b>MATOK</b><small style="display:block">BASIC · קליטת עובד חדש</small></div><div class="stripes" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div></div></header>
<main><div class="card"><h1>נעים להכיר</h1><p>ממלאים פעם אחת. פרטי השאלון מועברים לבדיקה של הנהלת MATOK.</p>
<div id="status" class="status" role="status" aria-live="polite"></div>
<form id="onboardForm" hidden>
<h2>פרטים ליצירת קשר</h2><div class="fields">
<label>שם מלא *<input name="full_name" autocomplete="name" maxlength="150" required></label>
<label>טלפון נייד *<input name="phone" autocomplete="tel" inputmode="tel" maxlength="16" required></label>
<label>דוא"ל <input name="email" type="email" autocomplete="email" maxlength="180"></label>
<label>עיר מגורים <input name="city" maxlength="100" autocomplete="address-level2"></label>
<label class="wide">כתובת <input name="address" maxlength="200" autocomplete="street-address"></label>
</div>
<h2>פרטי תפקיד וזמינות</h2><div class="fields">
<label>תפקיד מבוקש <select name="preferred_role"><option value="">לא צוין</option><option>מכירה</option><option>קופה</option><option>ניהול משמרת</option><option>מחסן וליקוט</option><option>הדפסות</option><option>אחר</option></select></label>
<label>זמינות בימי שישי <select name="friday"><option value="">לא ידוע</option><option>זמינ/ה</option><option>לא זמינ/ה</option><option>לסירוגין</option><option>לפי תיאום</option></select></label>
<label>מועד תחילת עבודה מועדף <input name="preferred_start" type="date"></label>
<label>משמרות אפשריות <select name="available_shifts"><option value="">טרם הוחלט</option><option>בקרים</option><option>ערבים</option><option>בקרים וערבים</option><option>לפי תיאום</option></select></label>
<label class="wide">ניסיון רלוונטי <textarea name="experience" maxlength="1500" rows="3" placeholder="אפשר לפרט בקצרה"></textarea></label>
<label class="wide">מידע נוסף <textarea name="notes" maxlength="1500" rows="3" placeholder="פרטים שחשוב שנדע"></textarea></label></div>
<label class="check"><input id="consent" name="consent" type="checkbox" required><span>אני מאשר/ת למסור את הפרטים לצורך בדיקת קליטה לעבודה, והם יישמרו במערכת הפרטית של MATOK.</span></label>
<div class="note">אין להזין כאן סיסמאות, פרטי חשבון בנק או מסמכים אישיים. ניתן להשלים מסמכים בהמשך מול ההנהלה.</div>
<button id="send" type="submit">שליחת השאלון להנהלה</button></form>
</div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
(()=>{
'use strict';
const status=document.getElementById('status'),form=document.getElementById('onboardForm'),button=document.getElementById('send');
const show=(txt,error=false)=>{status.textContent=txt;status.className='status'+(error?' error':'');status.style.display='block'};
const token=location.hash.replace(/^#/,'').trim();
const valid=/^[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(token);
const api=window.supabase?.createClient('https://yzipxcjijvmfasewjrov.supabase.co','sb_publishable_FElcaHVc65ILwkGqqYBJGA_dTGZIhVY',{auth:{persistSession:false,autoRefreshToken:false}});
(async()=>{
 if(!valid){show('הקישור אינו תקין. יש לבקש קישור אישי חדש מהנהלת MATOK.',true);return}
 if(!api){show('לא ניתן לטעון את טופס הקליטה כעת. נסו שוב.',true);return}
 try{const r=await api.rpc('onboarding_form_status',{p_token:token});if(r.error)throw r.error;if(!r.data?.open){show('הקישור כבר נוצל או פג תוקפו. יש לבקש קישור חדש מההנהלה.',true);return}form.hidden=false}
 catch(e){console.error('onboarding status',e);show('בדיקת הקישור נכשלה. נסו לפתוח שוב מאוחר יותר.',true)}
})();
form.addEventListener('submit',async event=>{
 event.preventDefault();if(button.disabled)return;
 if(!form.reportValidity())return;
 const data=Object.fromEntries(new FormData(form).entries());data.consent=document.getElementById('consent').checked?'true':'false';
 button.disabled=true;show('שולחים את השאלון…');
 try{const r=await api.rpc('onboarding_submit_form',{p_token:token,p_data:data});if(r.error)throw r.error;if(!r.data?.submitted)throw Error('not_saved');form.remove();show('השאלון התקבל בהצלחה. ההנהלה תעבור על הפרטים ותחזור אליך.')}
 catch(e){console.error('onboarding submit',e);show('לא ניתן היה לשלוח את השאלון. בדקו את הפרטים ונסו שוב.',true);button.disabled=false}
});
})();
</script>
</body></html>
