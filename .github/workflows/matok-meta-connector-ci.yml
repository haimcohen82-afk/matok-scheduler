name: MATOK Meta Connector CI

on:
  push:
    branches:
      - matok-meta-connector
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: meta-connector
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: meta-connector/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck

  supabase-and-oauth-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check Supabase Edge Functions
        run: deno check meta-connector/supabase/matok-meta-backend.owner-approval.ts meta-connector/supabase/matok-meta-mcp.read-only.ts meta-connector/supabase/matok-meta-mcp-v2-candidate.ts
      - name: Verify OAuth pages and security policy
        run: node meta-connector/scripts/verify-oauth-pages.mjs
