name: Verify MATOK production

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify production
        run: node verify.mjs
      - name: Artifact summary
        run: |
          test -s dist/index.html
          test -s dist/version.json
          wc -c dist/index.html dist/version.json
