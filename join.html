<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta name="robots" content="noindex,nofollow"><title>MATOK BASIC | שאלון קליטת עובד</title><style>
:root{font-family:Arial,Heebo,sans-serif;color:#1a1a2e;background:#f5f0e8}*{box-sizing:border-box}body{margin:0;padding:18px}.page{max-width:720px;margin:auto}.brand{text-align:center;margin:18px 0 22px}.brand b{display:block;letter-spacing:3px;font-size:29px}.brand small{letter-spacing:6px}.bars{display:flex;gap:3px;justify-content:center;margin-top:11px}.bars i{height:5px;width:28px;border-radius:4px;background:#e8826a}.bars i:nth-child(2){background:#6bbfb5}.bars i:nth-child(3){background:#a7cb8e}.bars i:nth-child(4){background:#7eb4dc}.bars i:nth-child(5){background:#f2c77a}.card{background:#fff;border:1px solid #ded9d1;border-radius:18px;padding:22px;box-shadow:0 9px 25px #1a1a2e10}h1{margin:0 0 8px;font-size:25px}p{line-height:1.7;color:#5c5963}label{display:block;font-size:13px;font-weight:bold;margin:13px 0 0}input,textarea,select{width:100%;font:inherit;margin-top:6px;padding:11px;border:1px solid #c5c8d0;border-radius:10px;background:#fff;direction:rtl}input:focus,textarea:focus,select:focus{outline:3px solid #a4d8cd}textarea{min-height:80px;resize:vertical}.cols{display:grid;grid-template-columns:1fr 1fr;gap:0 13px}.consent{display:flex;gap:8px;align-items:flex-start;font-weight:normal;line-height:1.6}.consent input{width:20px;flex:0 0 20px;margin-top:4px}.button{display:block;width:100%;border:0;border-radius:12px;background:#1a1a2e;color:#fff;padding:15px;font-weight:bold;font-size:17px;margin-top:18px;cursor:pointer}.button:disabled{opacity:.5}#status{padding:10px;margin-top:11px;border-radius:10px;display:none}#status.show{display:block;background:#eef9f6;color:#245c50}#status.error{background:#fff0ed;color:#8c372f}small{color:#686676}@media(max-width:570px){.cols{grid-template-columns:1fr}.card{padding:16px}h1{font-size:22px}}</style></head><body><div class="page"><div class="brand"><b>MATOK</b><small>BASIC</small><div class="bars"><i></i><i></i><i></i><i></i><i></i></div></div><main class="card"><h1>שאלון קליטת עובד/ת</h1><p>שלום וברוכים הבאים ל־MATOK BASIC. מלאו את הפרטים כדי שנוכל להכין את כרטיס העובד. השאלון מיועד למקבל/ת הקישור בלבד.</p><div id="initial">בודקים את הקישור המאובטח…</div><form id="intakeForm" style="display:none" autocomplete="on"><div class="cols"><label>שם מלא *<input name="full_name" required minlength="2" maxlength="150" autocomplete="name"></label><label>טלפון *<input name="phone" inputmode="tel" required minlength="9" maxlength="17" autocomplete="tel"></label><label>דוא״ל<input name="email" type="email" maxlength="180" autocomplete="email"></label><label>יישוב מגורים<input name="city" maxlength="100" autocomplete="address-level2"></label><label>כתובת (לא חובה)<input name="address" maxlength="200" autocomplete="street-address"></label><label>תפקיד מועדף<select name="preferred_role"><option value="">בחרו</option><option value="מכירה">מכירה</option><option value="קופה">קופה</option><option value="אחראית משמרת">אחריות משמרת</option><option value="כללי">כללי</option></select></label><label>העדפת משמרות<select name="available_shifts"><option value="">בחרו</option><option value="בוקר">בוקר</option><option value="ערב">ערב</option><option value="בוקר וערב">בוקר וערב</option><option value="גמיש/ה">גמיש/ה</option></select></label><label>זמינות לימי שישי<select name="friday"><option value="">בחרו</option><option value="כל שישי">כל שישי</option><option value="שישי לסירוגין">שישי לסירוגין</option><option value="לא זמין/ה">לא זמין/ה</option><option value="בתיאום">בתיאום</option></select></label><label>מועד תחילת עבודה מועדף<input name="preferred_start" type="date"></label></div><label>ניסיון קודם / תחומי אחריות<textarea name="experience" maxlength="1500" placeholder="ניסיון במכירות, קופה, תפעול, רשתות חברתיות ועוד"></textarea></label><label>מידע נוסף שחשוב לדעת<textarea name="notes" maxlength="1500"></textarea></label><label class="consent"><input name="consent" type="checkbox" required><span>אני מאשר/ת להעביר את הפרטים שמילאתי להנהלת MATOK BASIC לצורך בחינת קליטה לעבודה. לא התבקשתי למסור סיסמה, פרטי בנק או צילום תעודת זהות בטופס זה.</span></label><input type="text" name="website" tabindex="-1" autocomplete="off" style="position:absolute;left:-9999px;width:1px;height:1px" aria-hidden="true"><button class="button" id="submitBtn" type="submit">שליחת השאלון למנהל</button></form><div id="status" role="status" aria-live="polite"></div></main><p style="text-align:center;font-size:11px">MATOK BASIC · פרטי השאלון נשמרים באופן פרטי וממתינים לבדיקת המנהל.</p></div>
